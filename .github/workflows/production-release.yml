name: Production release gate

on:
  workflow_dispatch:
    inputs:
      evidence_path:
        description: Reviewed production evidence JSON committed to this revision
        required: true
        default: release/production-evidence.json
        type: string

permissions:
  contents: read

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-repository:
    name: Secretless repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'

      - name: Pin pnpm 11.16.0
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          test "$(pnpm --version)" = "11.16.0"

      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1

      - name: Verify repository
        run: pnpm verify:e1

      - name: Verify contracts
        run: |
          forge fmt --check --root packages/contracts
          forge lint --root packages/contracts
          forge test --force --root packages/contracts

      - name: Verify no-broadcast deployment planner
        run: pnpm verify:deployment-planner

  verify-production:
    name: Protected evidence verification - no deploy or broadcast
    needs: verify-repository
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CI: 'true'
      PRODUCTION_RELEASE_EVIDENCE_PATH: ${{ inputs.evidence_path }}
      PRODUCTION_CHAIN_MANIFEST_PATH: packages/chain-config/manifests/base-mainnet-v4-production.json
    steps:
      - name: Checkout the verified immutable revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Use Node.js 24.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'

      - name: Pin pnpm 11.16.0
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          test "$(pnpm --version)" = "11.16.0"

      - name: Frozen install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify protected production evidence and runtime
        env:
          PRODUCTION_RUNTIME_ATTESTATION_JSON: ${{ secrets.PRODUCTION_RUNTIME_ATTESTATION_JSON }}
          NEXT_PUBLIC_CHAIN_ID: '8453'
          NEXT_PUBLIC_CHAIN_MANIFEST_SHA256: ${{ vars.NEXT_PUBLIC_CHAIN_MANIFEST_SHA256 }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_IPFS_GATEWAY_BASE: ${{ vars.NEXT_PUBLIC_IPFS_GATEWAY_BASE }}
          NEXT_PUBLIC_BASE_BUILDER_CODE: ${{ vars.NEXT_PUBLIC_BASE_BUILDER_CODE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BASE_MAINNET_RPC_HTTP_PRIMARY: ${{ secrets.BASE_MAINNET_RPC_HTTP_PRIMARY }}
          BASE_MAINNET_RPC_HTTP_FALLBACK: ${{ secrets.BASE_MAINNET_RPC_HTTP_FALLBACK }}
          BASE_MAINNET_RPC_WSS_PRIMARY: ${{ secrets.BASE_MAINNET_RPC_WSS_PRIMARY }}
          BASE_MAINNET_RPC_WSS_FALLBACK: ${{ secrets.BASE_MAINNET_RPC_WSS_FALLBACK }}
          MARKET_READ_MAX_AGE_SECONDS: '60'
          MARKET_READ_REVISION: 0007_e9_b20_v4_launch_market_projection
          MARKET_READ_SCHEMA: public
          ETHEREUM_MAINNET_RPC_HTTP: ${{ secrets.ETHEREUM_MAINNET_RPC_HTTP }}
          UNISWAP_API_KEY: ${{ secrets.UNISWAP_API_KEY }}
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_WEBHOOK_SECRET: ${{ secrets.PINATA_WEBHOOK_SECRET }}
          PINATA_WEBHOOK_WORKSPACE_ID: ${{ vars.PINATA_WEBHOOK_WORKSPACE_ID }}
          FILEBASE_TOKEN: ${{ secrets.FILEBASE_TOKEN }}
          METADATA_PIN_PROVIDER_PROFILE: pinata-filebase-car-v1
          METADATA_GATEWAY_PROFILE: pinata-filebase-gateway-v1
          METADATA_PINATA_WEBHOOK_PROFILE: pinata-svix-car-v1
          METADATA_DURABLE_WORKFLOW_PROFILE: postgres-artifact-evidence-v1
          METADATA_PIN_AUTHORITY_REVIEW: approved-2026-08-14
          METADATA_PIN_LIVE_HEALTH_REVIEW: approved-2026-08-14
          METADATA_PIN_WRITES_ENABLED: 'true'
          SIWE_DOMAIN: ${{ vars.SIWE_DOMAIN }}
          SIWE_URI: ${{ vars.SIWE_URI }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          EDGE_RATE_LIMIT_POLICY_ID: ${{ vars.EDGE_RATE_LIMIT_POLICY_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          AI_READ_ONLY: 'true'
          DISABLE_NEW_LAUNCHES: 'false'
          DISABLE_B20_CREATE: 'false'
          DISABLE_ERC20_CREATE: 'true'
          DISABLE_LIQUIDITY_UI: 'true'
          DISABLE_TRADE_UI: 'false'
          DISABLE_LP_COLLECT_UI: 'false'
          DISABLE_UPLOADS: 'false'
          INDEXER_DEGRADED: 'false'
          ENABLE_B20: 'true'
          ENABLE_ERC20: 'false'
          ENABLE_UNISWAP_V4: 'true'
          DISABLE_PAYMASTER: 'true'
          FREEZE_POINTS: 'true'
          ENABLE_USDC_POOL: 'false'
          ENABLE_PROXY_APPROVAL_MAINNET: 'false'
          RPC_FORCE_FALLBACK: 'false'
        run: |
          pnpm exec tsx scripts/check-production-release.ts
          pnpm exec tsx scripts/check-production-runtime.ts
          pnpm exec tsx scripts/check-production-database.ts

      - name: Confirm workflow has no deployment authority
        shell: bash
        run: |
          test -z "${PRIVATE_KEY:-}"
          test -z "${MNEMONIC:-}"
          test -z "${SEED_PHRASE:-}"
          printf 'Production verification passed. No deploy, sign, or broadcast step exists.\n'
