name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: Core, indexer, web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -r test
      - name: Build the web app
        run: pnpm --filter @stockpair/web build
        env:
          NEXT_PUBLIC_APP_URL: https://launchpad.basestocks.finance

  contracts:
    name: Foundry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (same layout as foundry.toml remappings)
        run: |
          forge install foundry-rs/forge-std@v1.9.7 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.2.0 --no-git
          forge install uniswap/v4-periphery --no-git
      - run: forge build --sizes
      # The checked-in TypeScript ABI must be exactly what this build produces.
      - name: ABI in packages/core matches the contracts
        run: node ../../scripts/gen-abi.mjs --check
      - run: forge test -vv
